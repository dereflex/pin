<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloqueo con PIN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      flex-direction: column;
      text-align: center;
    }
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #lock-screen input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
    }
    #lock-screen button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #lock-screen button:hover {
      background-color: #45a049;
    }
    #movie-section {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 20px;
    }
    .movie-card {
      width: 150px;
      height: 180px; /* Reducción de la altura de las portadas */
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }
    .movie-card:hover {
      transform: scale(1.05);
    }
    .movie-card img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
    .movie-card p {
      position: absolute;
      color: white;
      font-size: 14px;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
    }
    h1 {
      font-size: 25px;
      margin-bottom: 10px;
      color: #333;
    }
    h2 {
      font-size: 18px;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Descarga Películas en HD</h1>
  <h2>Colección de películas del 2024 </h2>

  <div id="movie-section">
    <div class="movie-card" onclick="window.location.href='https://link-a-tu-pelicula1.com'">
      <img src="https://i.ibb.co/KKWc8Ly/photo-5024024697733492814-x.jpg" alt="Película 1">
      <p></p>
    </div>
    <div class="movie-card" onclick="window.location.href='https://link-a-tu-pelicula2.com'">
      <img src="https://i.ibb.co/3rGHYgQ/photo-5024024697733492816-x.jpg" alt="Película 2">
      <p></p>
    </div>
    <div class="movie-card" onclick="window.location.href='https://link-a-tu-pelicula3.com'">
      <img src="https://i.ibb.co/QDDCryc/photo-5024024697733492817-x.jpg" alt="Película 3">
      <p></p>
    </div>
    <div class="movie-card" onclick="window.location.href='https://link-a-tu-pelicula3.com'">
      <img src="https://i.ibb.co/JyZZSJq/photo-5024024697733492818-x.jpg" alt="Película 4">
      <p></p>
    </div>
    <div class="movie-card" onclick="window.location.href='https://link-a-tu-pelicula3.com'">
      <img src="https://i.ibb.co/tZJNL7B/photo-5024024697733492815-x.jpg" alt="Película 5">
      <p></p>
    </div>
    <div class="movie-card" onclick="window.location.href='https://image.tmdb.org/t/p/original/22rqNtep5jWkJzB4YYYpXPxqcPH.jpg'">
      <img src="https://image.tmdb.org/t/p/original/22rqNtep5jWkJzB4YYYpXPxqcPH.jpg" alt="Película 6">
      <p></p>
    </div>
  </div>

  <div id="lock-screen">
    <p>Ingresa el PIN para desbloquear:</p>
    <input type="password" id="pin-input" placeholder="PIN">
    <button id="unlock-btn">Desbloquear</button>
    <p id="error-message" style="color: red; display: none;">PIN incorrecto. Inténtalo nuevamente.</p>
  </div>

  <script>
    const PIN = "1143"; // PIN requerido
    const lockScreen = document.getElementById("lock-screen");
    const pinInput = document.getElementById("pin-input");
    const unlockBtn = document.getElementById("unlock-btn");
    const errorMessage = document.getElementById("error-message");

    // Función para bloquear la pantalla
    function lockPage() {
      setTimeout(function() {
        lockScreen.style.display = "flex";
      }, 30000); // Esperar 30s (30000 ms)
    }

    // Función para desbloquear la pantalla
    function unlockPage() {
      const userPin = pinInput.value;
      if (userPin === PIN) {
        lockScreen.style.display = "none";
        errorMessage.style.display = "none";
        localStorage.setItem("lastUnlock", Date.now());
      } else {
        errorMessage.style.display = "block";
      }
    }

    // Evento de desbloqueo
    unlockBtn.addEventListener("click", unlockPage);

    // Verificar si han pasado 24 horas
    function shouldLock() {
      const lastUnlock = localStorage.getItem("lastUnlock");
      if (!lastUnlock) {
        return true;
      }
      const elapsedTime = Date.now() - parseInt(lastUnlock, 10);
      return elapsedTime >= 24 * 60 * 60 * 1000; // 24 horas en milisegundos
    }

    // Bloquear la pantalla si corresponde
    if (shouldLock()) {
      lockPage();
    }
  </script>
</body>
</html>
